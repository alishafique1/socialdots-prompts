name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.2
      - name: Privacy check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python scripts/check_privacy.py --require-denylist
      - name: Prompt format check
        run: python scripts/check_prompts.py
      - name: Tests
        run: python -m unittest discover -s tests -v
